name: Publish Next.js export to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-static"
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[pages-sync]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build static site
        run: bun run build

      - name: Publish export to legacy Pages root
        run: |
          set -euo pipefail

          touch .nojekyll
          cp -R out/. .
          rm -rf out

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated Pages changes to commit."
            exit 0
          fi

          git commit -m "chore(pages): sync static export [pages-sync]"
          git push origin HEAD:${GITHUB_REF_NAME}
