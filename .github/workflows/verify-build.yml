name: Verify production build

on:
  push:
    branches:
      - "main"
      - "feat/cybersecurity-complete-course-2026"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production export
        run: bun run build
