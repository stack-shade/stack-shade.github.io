<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">HTTP Status Codes</title>
<desc id="desc">Five HTTP response families from 1xx informational through 5xx server errors.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111318"/>
    <stop offset="1" stop-color="#2a2e36"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/>
  </pattern>
</defs>
<rect width="1200" height="630" rx="34" fill="#090b0f"/>
<rect x="28" y="28" width="1144" height="574" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="574" rx="28" fill="url(#grid)"/>
<text x="84" y="104" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#cbd5e1">STACKSHADE / WEB MECHANICS</text>
<text x="84" y="184" font-family="Arial,sans-serif" font-size="62" font-weight="900" fill="#fff">HTTP Status Codes</text>
<text x="84" y="228" font-family="Arial,sans-serif" font-size="24" fill="#cbd5e1">read the response before you read the bug report</text>
<g transform="translate(84 315)">
  <rect x="0" y="0" width="194" height="128" rx="20" fill="#10141a" stroke="#94a3b8" stroke-opacity=".45"/>
  <text x="24" y="50" font-family="ui-monospace,monospace" font-size="42" font-weight="900" fill="#fff">1xx</text>
  <text x="24" y="84" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">information</text>
  <text x="24" y="106" font-family="Arial,sans-serif" font-size="12" fill="#64748b">continue · hints</text>
  <rect x="212" y="0" width="194" height="128" rx="20" fill="#10141a" stroke="#94a3b8" stroke-opacity=".45"/>
  <text x="236" y="50" font-family="ui-monospace,monospace" font-size="42" font-weight="900" fill="#fff">2xx</text>
  <text x="236" y="84" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">success</text>
  <text x="236" y="106" font-family="Arial,sans-serif" font-size="12" fill="#64748b">created · returned</text>
  <rect x="424" y="0" width="194" height="128" rx="20" fill="#10141a" stroke="#94a3b8" stroke-opacity=".45"/>
  <text x="448" y="50" font-family="ui-monospace,monospace" font-size="42" font-weight="900" fill="#fff">3xx</text>
  <text x="448" y="84" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">redirect</text>
  <text x="448" y="106" font-family="Arial,sans-serif" font-size="12" fill="#64748b">move · cache</text>
  <rect x="636" y="0" width="194" height="128" rx="20" fill="#10141a" stroke="#94a3b8" stroke-opacity=".45"/>
  <text x="660" y="50" font-family="ui-monospace,monospace" font-size="42" font-weight="900" fill="#fff">4xx</text>
  <text x="660" y="84" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">client error</text>
  <text x="660" y="106" font-family="Arial,sans-serif" font-size="12" fill="#64748b">auth · input · limits</text>
  <rect x="848" y="0" width="194" height="128" rx="20" fill="#10141a" stroke="#94a3b8" stroke-opacity=".45"/>
  <text x="872" y="50" font-family="ui-monospace,monospace" font-size="42" font-weight="900" fill="#fff">5xx</text>
  <text x="872" y="84" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">server error</text>
  <text x="872" y="106" font-family="Arial,sans-serif" font-size="12" fill="#64748b">upstream · overload</text>
</g>
<text x="84" y="548" font-family="Arial,sans-serif" font-size="18" fill="#94a3b8">Original StackShade illustration • source-aware reference • lightweight SVG</text>
</svg>